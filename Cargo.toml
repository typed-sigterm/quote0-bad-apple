[workspace]
members = ["firmware", "host"]
resolver = "2"

# Profiles live at the workspace root and apply to all members.
# Tuned for the firmware (size matters on the device); harmless for the host tool.
[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
